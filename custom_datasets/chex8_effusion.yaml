# =============================================================================
# ChestX-ray8 Effusion Configuration
# Focused on Pleural Effusion intervention with demographic + view conditioning
# =============================================================================

# Dataset Configuration
dataset:
  name: chex8
  data_dir: ./data/xray8_256
  split:
    train: "train"
    val: "test"
    test: "test"
  ratio: 1.0

  transforms:
    - type: ToTensor
    - type: Normalize
      mean: [0.5, 0.5, 0.5]
      std: [0.5, 0.5, 0.5]

# Schema: Medical metadata and disease labels
schema:
  Sex:
    type: categorical
    num_classes: 2
    vocab:
      Male: 0
      Female: 1
    adapter_dim: 16
    adapter_dim_arg: dim_sex
    adapter_fwd_arg: e_sex
    lora_dim: 1152

  Age:
    type: continuous
    range: [0, 1]
    adapter_dim: 16
    adapter_dim_arg: dim_age
    adapter_fwd_arg: e_age
    lora_dim: 1152

  View:
    type: categorical
    num_classes: 2
    vocab:
      PA: 0
      AP: 1
    adapter_dim: 64
    adapter_dim_arg: dim_view
    adapter_fwd_arg: e_view
    lora_dim: 1152

  # Disease label — single binary parent matching the paper's 4-parent SCM
  Disease:
    type: group_categorical
    keys:
      - Effusion
    num_classes: 2
    vocab:
      No: 0
      Yes: 1
    adapter_dim: 64
    adapter_dim_arg: dim_disease
    adapter_fwd_arg: e_disease
    lora_dim: 1152
