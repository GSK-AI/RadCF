# =============================================================================
# LoRA RADEdit — LoRA hyperparameters + training settings
# =============================================================================
# Dataset config (schema, transforms, data paths) comes from custom_datasets.
# Pass --dataset chex8 or --dataset chexpert_frontal at launch time.
# =============================================================================

lora:
  rank: 16
  alpha: 32
  target_modules:
    - to_q
    - to_k
    - to_v
    - to_out.0
  bias: none
  cfg_dropout_prob: 0.1
  num_meta_tokens: 4

training:
  batch_size: 16
  num_workers: 8
  num_epochs: 100
  learning_rate: 1.0e-4
  weight_decay: 1.0e-2
  gradient_clip: 1.0
  save_every_n_steps: 10000
  log_visualization_every_n_steps: 5000
