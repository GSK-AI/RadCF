# =============================================================================
# From-Scratch Training Configuration (LDM-only / REPA-E)
# =============================================================================

model:
  backbone: "SiT-XL/2"
  enc_type: "dinov2-vit-b"
  encoder_depth: 8
  qk_norm: false
  fused_attn: true
  bn_momentum: 0.1
  compile: true

training:
  batch_size: 16
  num_workers: 4
  num_epochs: 1400
  max_train_steps: 400000
  checkpoint_every_n_steps: 50000
  log_visualization_every_n_steps: 10000
  learning_rate: 1.0e-4
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_weight_decay: 0.0
  adam_epsilon: 1.0e-8
  max_grad_norm: 1.0
  gradient_accumulation_steps: 1
  mixed_precision: "bf16"
  allow_tf32: true
  resolution: 256
  report_to: "tensorboard"

flow:
  path_type: "linear"
  prediction: "v"
  weighting: "uniform"
  cfg_prob: 0.1
  proj_coeff: 0.5

vae:
  type: "f8d4"
  ckpt: "./checkpoints/vaes/sdvae/sdvae-f8d4.pt"

vae_update:
  enabled: false
  disc_pretrained_ckpt: "./checkpoints/vaes/sdvae/sdvae-f8d4-discriminator-ckpt.pt"
  loss_cfg_path: "radcf/configs/l1_lpips_kl_gan.yaml"
  learning_rate: 1.0e-4
  disc_learning_rate: 1.0e-4
  align_proj_coeff: 1.5
